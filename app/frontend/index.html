<!DOCTYPE html>
<html>
<head>
    <title>DocuSaurAI 🦖</title>
    <style>
        body { font-family: Arial; background: #f5f5f5; }
        .chat { width: 600px; margin: auto; background: white; padding: 20px; }
        .msg { margin: 10px 0; }
        .user { font-weight: bold; }
        .bot { color: green; }
    </style>
</head>
<body>

<div class="chat">
    <h2>📘 Chat with your Book</h2>

    <div id="messages"></div>

    <input id="q" placeholder="Ask something..." style="width:80%">
    <button onclick="ask()">Ask</button>
</div>

<script>
async function ask() {
    let q = document.getElementById("q").value;
    if (!q) return;

    document.getElementById("messages").innerHTML +=
        `<div class='msg user'>You: ${q}</div>`;

    const res = await fetch("rag-book-chatboting-production.up.railway.app", {
        method: "POST",
        headers: { "Content-Type": "application/json","Accept": "application/json"  },
        body: JSON.stringify({ question: q })
    });

    const data = await res.json();



    document.getElementById("messages").innerHTML +=
        `<div class='msg bot'>🦖: ${data.answer}</div>`;

    document.getElementById("q").value = "";
}
</script>

</body>
</html>
